name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Chromatic needs history to diff against a baseline

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24.x
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check
        run: vp check

      # `vp check` type-checks via tsgolint, which does not understand
      # `.svelte` files -- svelte-check is still the only thing that covers
      # the 35 components.
      - name: Svelte type check
        run: vp run check:svelte

      - name: Unit tests
        # `npm run` resolves the local `vp` binary, which also resolves the
        # locally-installed optional coverage provider.
        run: npm run test:coverage -- --project=server

      # ADR-0003: fail on high/critical, review moderate/low manually.
      - name: npm audit
        run: npm audit --audit-level=high
