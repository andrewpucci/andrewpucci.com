name: Dependabot intelligent review

on:
  # This trusted follow-up can comment even though Dependabot's CI token is read-only.
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: dependabot-intelligent-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run checks out the trusted default branch; no PR code is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Review dependency update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node .github/actions-scripts/dependabot-review/run.mjs
