name: Dependabot intelligent review

on:
  # A privileged follow-up can write a comment even when Dependabot's CI
  # token is read-only. It never checks out or executes PR code.
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: dependabot-intelligent-review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run checks out the trusted default branch; no PR code is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # The app is installed only on this repository and can write issue comments.
      - name: Create review-comment app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.0.6
        with:
          app-id: ${{ secrets.DEPENDABOT_REVIEW_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_REVIEW_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Review dependency update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_COMMENT_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_COMMENT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node .github/actions-scripts/dependabot-review/run.mjs
