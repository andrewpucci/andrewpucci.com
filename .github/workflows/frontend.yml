name: Frontend integration

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'tokens/**'
      - 'terrazzo.config.ts'
      - 'vite-plugin-terrazzo.ts'
      - 'svelte.config.ts'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'tokens/**'
      - 'terrazzo.config.ts'
      - 'vite-plugin-terrazzo.ts'
      - 'svelte.config.ts'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: 24.x
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # playwright.config.ts's webServer runs `npm run build && npm run
      # preview:pages` itself (Wrangler, not `vp preview`), so this also
      # exercises the real Cloudflare Pages build.
      - name: E2E + accessibility tests
        run: npm run test:e2e -- --project=${{ matrix.browser }} --retries=2
        env:
          # Fork PRs cannot access repository secrets. Functional checks run
          # everywhere; trusted PRs and main pushes upload to Argos once its
          # repository token is configured.
          ARGOS_UPLOAD: ${{ matrix.browser == 'chromium' && secrets.ARGOS_TOKEN != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false) && 'true' || 'false' }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          # Cloudflare's documented public Turnstile test key makes the form
          # available for client-side E2E validation. It cannot verify a real
          # challenge and has no production authority.
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            ~/.config/.wrangler/logs/
          retention-days: 7
