name: Performance

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'tokens/**'
      - 'terrazzo.config.ts'
      - 'vite-plugin-terrazzo.ts'
      - 'scripts/lighthouse.ts'
      - 'scripts/lighthouse-regression.ts'
      - 'playwright.config.ts'
      - 'svelte.config.ts'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/performance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'tokens/**'
      - 'terrazzo.config.ts'
      - 'vite-plugin-terrazzo.ts'
      - 'scripts/lighthouse.ts'
      - 'scripts/lighthouse-regression.ts'
      - 'playwright.config.ts'
      - 'svelte.config.ts'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance:
    name: Performance regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The regression gate builds the PR base (or previous main commit)
          # on the same runner so hardware variance affects both samples.
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24.x
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build current commit
        run: vp build

      - name: Audit current commit
        env:
          LIGHTHOUSE_LCP_MODE: warn
          LIGHTHOUSE_REPORT_DIR: lighthouse-reports/current
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: |
          npm run preview:pages &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4173 > /dev/null
          npm run test:lighthouse

      - name: Resolve performance baseline
        id: lighthouse-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No base commit is available; skipping the relative LCP gate."
          fi

      - name: Build performance baseline
        id: lighthouse-base-build
        if: steps.lighthouse-base.outputs.available == 'true'
        env:
          BASE_SHA: ${{ steps.lighthouse-base.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/lighthouse-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/lighthouse-base"
          if vp install && vp build; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "Base commit $BASE_SHA does not build with the current toolchain; skipping the relative LCP gate."
          fi

      - name: Audit performance baseline
        if: steps.lighthouse-base.outputs.available == 'true' && steps.lighthouse-base-build.outputs.buildable == 'true'
        env:
          LIGHTHOUSE_LCP_MODE: warn
          LIGHTHOUSE_REPORT_DIR: lighthouse-reports/base
          LIGHTHOUSE_THRESHOLD_MODE: warn
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TEST_BASE_URL: http://localhost:4174
        run: |
          # Serve both builds with the current commit's pinned Wrangler so the
          # comparison changes the application revision, not the test harness.
          npx wrangler pages dev "$RUNNER_TEMP/lighthouse-base/.svelte-kit/cloudflare" --port 4174 \
            --binding PUBLIC_TURNSTILE_SITE_KEY="$PUBLIC_TURNSTILE_SITE_KEY" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4174 > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4174 > /dev/null
          npm run test:lighthouse

      - name: Compare LCP with baseline
        if: steps.lighthouse-base.outputs.available == 'true' && steps.lighthouse-base-build.outputs.buildable == 'true'
        run: npm run test:lighthouse:regression

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 7
